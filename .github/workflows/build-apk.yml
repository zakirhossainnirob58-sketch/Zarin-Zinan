name: Build Zarin & Zinan APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          echo "Files in repository:"
          find . -maxdepth 4 -type f

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP file found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Gradle Project
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "All extracted files:"
            find extracted -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Project files:"
          ls -la

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find extracted -type f -name "*.apk" -print      - name: Check App Permissions
        run: |
          echo "Searching for AndroidManifest.xml..."

          MANIFEST=$(find extracted -type f -name "AndroidManifest.xml" | head -1)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          echo "Manifest found at:"
          echo "$MANIFEST"

          echo "Checking permissions:"
          grep -o 'android.permission.[A-Z_]*' "$MANIFEST" | sort -u || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zarin-Zinan-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
