name: Build Zarin & Zinan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Gradle project
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Replace HTML
        run: |
          HTML_FILE=$(find extracted -type f -path "*/src/main/assets/index.html" | head -1)
          if [ -z "$HTML_FILE" ]; then
            echo "index.html not found in Android assets!"
            exit 1
          fi
          cp index.html "$HTML_FILE"
          echo "HTML replaced: $HTML_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Check App Permissions
        run: |
          MANIFEST=$(find extracted -type f -name "AndroidManifest.xml" | head -1)
          echo "========== APP PERMISSIONS =========="
          grep -o 'android.permission.[A-Z_]*' "$MANIFEST" | sort -u || true
          echo "====================================="

      - name: Check HTML Security
        run: |
          echo "========== HTML SECURITY CHECK =========="
          grep -RniE "fetch\(|XMLHttpRequest|axios|https?://|location\.href|window\.open|document\.cookie" extracted/app/src/main/assets --include="*.html" --include="*.js" || true
          echo "========== END HTML SECURITY CHECK =========="

      - name: Find APK
        run: |
          find extracted -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zarin-Zinan-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
