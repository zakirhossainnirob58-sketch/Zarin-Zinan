name: Build Zarin & Zinan APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q Zarin_zinan_apk_ready.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle Project
        run: |
          SETTINGS=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zarin-Zinan-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
